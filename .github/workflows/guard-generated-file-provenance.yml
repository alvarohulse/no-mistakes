name: Guard generated file provenance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release-please-generated file provenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu

          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::Pull request number is not numeric" >&2
              exit 1
              ;;
          esac

          pr_head_ref=refs/no-mistakes/guard-generated-files/pr-head
          git fetch --no-tags --force origin \
            "+refs/pull/${PR_NUMBER}/head:${pr_head_ref}"
          fetched_head=$(git rev-parse --verify "${pr_head_ref}^{commit}")
          if [ "$fetched_head" != "$HEAD_SHA" ]; then
            echo "::error::Fetched pull request head does not match the event" >&2
            exit 1
          fi

          trusted_script="${RUNNER_TEMP}/guard-generated-files.sh"
          git show "${BASE_SHA}:scripts/guard-generated-files.sh" > "$trusted_script"
          sh "$trusted_script" \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            "https://github.com/kunchenguid/no-mistakes.git"
