name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: test (ubuntu-latest)
          - os: macos-latest
            name: test (macos-latest)
          - os: windows-latest
            name: test (windows-core)
            shard: core
          - os: windows-latest
            name: test (windows-git)
            shard: git
    runs-on: ${{ matrix.os }}
    # A single Windows ./... job repeatedly exceeded its cap without any test
    # binary hitting -timeout. Split git-heavy packages from the remainder so
    # each shard produces a real verdict; 40 minutes remains a runaway guard.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test on Unix
        if: runner.os != 'Windows'
        run: go test -race ./...

      # Keep this list in lockstep with NM_CI_WINDOWS_GIT_EXCLUDE below. The
      # workflow contract test resolves both through go list and rejects drift.
      - name: Test on Windows (git-heavy)
        if: runner.os == 'Windows' && matrix.shard == 'git'
        run: go test -v -timeout=15m ./internal/git ./internal/branchsync ./internal/gate ./internal/pipeline/steps ./internal/daemon

      - name: Test on Windows (core)
        if: runner.os == 'Windows' && matrix.shard == 'core'
        shell: pwsh
        env:
          NM_CI_WINDOWS_GIT_EXCLUDE: '/internal/(git|branchsync|gate|pipeline/steps|daemon)$'
        run: |
          $pkgs = go list ./...
          $goListExitCode = $LASTEXITCODE
          if ($goListExitCode -ne 0) {
            exit $goListExitCode
          }
          $pkgs = $pkgs | Where-Object { $_ -notmatch $env:NM_CI_WINDOWS_GIT_EXCLUDE }
          go test -v -timeout=15m @pkgs

      - name: Build
        run: go build ./cmd/no-mistakes

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The e2e suite drives the real no-mistakes binary against a fake
      # agent through `git push -> daemon -> pipeline -> push to upstream`
      # for claude, codex, opencode, and cursor. It builds the binary itself, so
      # no separate build step is needed. Linux-only for now: opencode's
      # ephemeral HTTP server picks up unused ports via :0, which is
      # fine on Linux runners but flakes on Windows agent harnesses.
      - name: End-to-end suite
        run: make e2e
